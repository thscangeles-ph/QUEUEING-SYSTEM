<style>
:root {
  --bg: #f7f4ed; --ink: #2e291f; --card: #fffefb; --line: #e2d7c2; --line-soft: #eee6d8; --muted: #756b59; --muted-2: #857967;
  --brown: #2f281c; --brown-2: #4a3d27; --brown-3: #2a2318; --gold: #d8a321; --gold-2: #f0c864; --primary: #8b6512; --primary-dark: #6f4e0a;
  --cream: #fff2c8; --cream-ink: #6f4e0a; --ok-bg: #edf5e8; --ok: #41612c; --bad-bg: #fde8eb; --bad: #9b1f35; --soft: #f2ecdf;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Aptos", "Segoe UI", Arial, sans-serif; font-size: 15px; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.hidden { display: none !important; }

/* Staff shell */
.top { background: var(--brown); color: #fff; border-bottom: 1px solid #5c4b2d; }
.top-in { max-width: 1480px; margin: 0 auto; padding: 12px 24px 0; }
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand img { height: 44px; width: auto; flex: none; }
.brand small { display: block; color: var(--gold-2); font-size: 11px; font-weight: 700; letter-spacing: .08em; }
.brand b { display: block; font-size: 18px; }
.top-actions { display: flex; align-items: center; gap: 8px; }
.badge-device { background: var(--brown-2); color: var(--gold-2); border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 700; }
.nav { display: flex; gap: 4px; overflow-x: auto; padding: 8px 0 8px; }
.nav a, .nav button { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; color: #e8dec7; text-decoration: none; padding: 8px 12px; border-radius: 8px; font-weight: 600; font-size: 14px; white-space: nowrap; }
.nav a:hover, .nav button:hover { background: var(--brown-2); color: #fff; }
.nav a.on { background: var(--gold-2); color: var(--brown); }
.wrap { max-width: 1480px; margin: 0 auto; padding: 22px 24px 40px; }
.note { background: #fff9e9; border: 1px solid #ead9ad; color: #5f4307; border-radius: 12px; padding: 10px 14px; font-size: 13px; line-height: 1.5; margin-bottom: 18px; }

/* Controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 38px; padding: 0 14px; border-radius: 8px; border: 1px solid transparent; font-weight: 600; font-size: 14px; white-space: nowrap; background: var(--primary); color: #fff; }
.btn:hover { background: var(--primary-dark); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.outline { background: #fff; color: var(--ink); border-color: var(--line); }
.btn.outline:hover { background: #fff9e9; }
.btn.ghost { background: transparent; color: var(--muted); border-color: transparent; }
.btn.ghost:hover { background: var(--soft); color: var(--ink); }
.btn.dark { background: var(--brown); color: var(--gold-2); }
.btn.dark:hover { background: var(--brown-2); }
.btn.on-dark { background: transparent; color: #fff; border-color: var(--gold); }
.btn.on-dark:hover { background: var(--brown-2); }
.btn.sm { min-height: 32px; padding: 0 10px; font-size: 13px; }
.btn.icon { width: 32px; padding: 0; min-height: 32px; }
.btn.danger { background: #fff; color: #b4233c; border-color: #efb5bf; }
input[type=text], input[type=tel], input[type=number], input[type=search], input[type=password], select { min-height: 40px; border: 1px solid #d8c79f; border-radius: 8px; background: #fff; padding: 0 10px; width: 100%; }
input:focus, select:focus, button:focus-visible { outline: 3px solid rgba(216,163,33,.45); outline-offset: 1px; }
label.field { display: grid; gap: 6px; font-size: 13px; font-weight: 600; color: #514838; }
label.field em { font-style: normal; font-weight: 400; color: var(--muted-2); font-size: 12px; margin-top: -4px; }

/* Layout */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 18px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
.stat p { margin: 0; }
.stat .k { color: #746957; font-size: 13px; font-weight: 600; }
.stat .v { font-size: 26px; font-weight: 800; margin-top: 4px; font-variant-numeric: tabular-nums; }
.stat .d { color: #807562; font-size: 13px; }
.stat.accent { background: #4a3612; border-color: var(--gold); color: #fff; }
.stat.accent .k { color: var(--gold-2); } .stat.accent .d { color: #f4e8c7; }
.grid { display: grid; grid-template-columns: 410px minmax(0, 1fr); gap: 18px; align-items: start; }
.col { display: grid; gap: 18px; min-width: 0; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; }
.panel-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; padding: 14px 18px; border-bottom: 1px solid var(--line-soft); }
.panel-h h2 { margin: 0; font-size: 16px; }
.panel-h p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.panel-b { padding: 16px 18px; }
.empty { border: 1px dashed #d8c8a6; border-radius: 12px; padding: 18px; text-align: center; color: var(--muted-2); font-size: 14px; }

/* Arrival numbers */
.gen { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.gen .btn { min-height: 46px; font-size: 15px; white-space: normal; }
.gen-opts { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; margin-top: 10px; font-size: 13px; }
.gen-opts label { display: flex; align-items: center; gap: 6px; } .gen-opts input { width: 16px; height: 16px; accent-color: var(--primary); }
.newnum { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--brown); color: #fff; border: 1px solid var(--gold); border-radius: 12px; padding: 10px 14px; margin-top: 12px; }
.newnum small { display: block; color: var(--gold-2); font-size: 12px; font-weight: 600; } .newnum b { font-size: 30px; letter-spacing: .03em; }
.sub { margin: 18px 0 0; color: var(--primary); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.chip-num.wide { width: auto; min-width: 64px; padding: 0 8px; }
.st-registration { background: #e8eef7; color: #2d4a6e; }
.toggles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
.tog { display: flex; align-items: center; gap: 8px; text-align: left; border: 1px solid #d8c79f; background: #fff; color: #4c4436; border-radius: 12px; padding: 8px 10px; font-size: 13px; }
.tog:hover { border-color: var(--gold); }
.tog b { display: block; font-size: 14px; } .tog small { display: block; color: var(--muted); font-size: 12px; }
.tog .box { display: grid; place-items: center; width: 20px; height: 20px; flex: none; border: 1px solid #d8c79f; border-radius: 6px; color: transparent; font-size: 13px; font-weight: 800; }
.tog[aria-pressed="true"] { background: var(--brown); border-color: var(--brown); color: #fff; } .tog[aria-pressed="true"] small { color: #e8dec7; }
.tog[aria-pressed="true"] .box { background: var(--gold-2); border-color: var(--gold-2); color: var(--brown); }
.tag.new { background: #e3f0dc; color: #36561f; }
.tag.qr { background: #e8eef7; color: #2d4a6e; }
.row-form { display: flex; gap: 8px; }
.row-form input { width: 90px; flex: none; }
.row-form .btn { flex: 1; }
.cards { list-style: none; margin: 14px 0 0; padding: 0 4px 0 0; display: grid; gap: 8px; max-height: 340px; overflow-y: auto; }
.cards li { display: flex; align-items: center; gap: 10px; border: 1px solid #e8dfce; border-radius: 12px; padding: 7px 10px; }
.cards li.called { border-color: var(--gold); background: #fff9e9; }
.chip-num { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 9px; background: var(--brown); color: var(--gold-2); font-weight: 800; font-size: 18px; flex: none; }
.cards .info { flex: 1; min-width: 0; font-size: 13px; }
.cards .info b { display: block; }
.cards .info span { color: #7d725f; }

/* Register form */
form.reg { display: grid; gap: 14px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--soft); padding: 4px; border-radius: 12px; }
.seg button { border: 0; border-radius: 8px; padding: 8px; background: transparent; color: var(--muted); font-weight: 600; }
.seg button.on { background: #fff; color: var(--brown); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.steps { list-style: none; margin: 0 0 6px; padding: 0; display: grid; gap: 6px; }
.steps li { display: flex; align-items: center; gap: 8px; border: 1px solid #e8dfce; background: #faf7f0; border-radius: 8px; padding: 5px 10px; font-size: 14px; }
.steps li .n { color: var(--primary); font-weight: 700; }
.steps li .name { flex: 1; color: #5e5443; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.steps li button { border: 0; background: none; color: var(--muted-2); font-size: 16px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border: 1px solid #d8c79f; background: #fff; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; }
.chips button span { font-weight: 400; color: var(--muted); }
.chips button:hover { border-color: var(--gold); background: #fff9e9; }
.check { display: flex; gap: 10px; align-items: flex-start; border: 1px solid #e8dfce; border-radius: 12px; padding: 10px 12px; font-size: 14px; }
.check input { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--primary); }
.check small { display: block; color: var(--muted); }
.issued { background: var(--brown); color: #fff; border: 1px solid var(--gold); border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; }
.issued .k { color: var(--gold-2); font-weight: 600; font-size: 13px; margin: 0; }
.issued .num { font-size: 40px; font-weight: 800; letter-spacing: .03em; margin: 2px 0; }
.issued .d { color: #e8dec7; font-size: 13px; margin: 0 0 10px; }

/* Patients table */
.tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.tools input { width: 190px; min-height: 34px; }
.filters { display: flex; background: var(--soft); border-radius: 8px; padding: 3px; }
.filters button { border: 0; background: none; border-radius: 6px; padding: 4px 10px; font-weight: 600; font-size: 13px; color: var(--muted); }
.filters button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; color: var(--muted); font-weight: 600; font-size: 13px; background: #faf5e9; padding: 9px 10px; white-space: nowrap; }
td { border-top: 1px solid var(--line-soft); padding: 9px 10px; vertical-align: middle; }
th:first-child, td:first-child { padding-left: 18px; } th:last-child, td:last-child { padding-right: 18px; }
td .q { font-size: 16px; font-weight: 800; }
td small { display: block; color: var(--muted-2); font-size: 12px; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; font-size: 12px; color: var(--muted-2); }
.tag { border-radius: 999px; padding: 1px 8px; font-weight: 700; font-size: 12px; }
.tag.prio { background: #fff0bd; color: #5f4307; }
.pill { display: inline-block; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.st-waiting { background: var(--cream); color: var(--cream-ink); } .st-called { background: var(--brown); color: var(--gold-2); }
.st-missed { background: var(--bad-bg); color: var(--bad); } .st-completed { background: var(--ok-bg); color: var(--ok); }
.st-cancelled, .st-pending { background: #efebe4; color: #7d725f; }
.route { display: flex; gap: 4px; flex-wrap: wrap; }
.route span { border-radius: 4px; padding: 1px 6px; font-size: 12px; font-weight: 700; background: var(--soft); color: var(--muted); }
.route span.done { background: var(--ok-bg); color: var(--ok); } .route span.cur { background: var(--brown); color: var(--gold-2); }
.acts { display: flex; justify-content: flex-end; gap: 4px; flex-wrap: wrap; }
tr.cancelled td { opacity: .55; }
.foot-note { color: var(--muted-2); font-size: 12px; margin: 14px 18px 16px; }

/* Settings */
.modal-bg { position: fixed; inset: 0; background: rgba(31,26,18,.55); display: grid; place-items: start center; padding: 40px 16px; overflow-y: auto; z-index: 40; }
.modal { width: min(1000px, 100%); }
.set-table { width: 100%; min-width: 820px; }
.set-table td { padding: 6px 6px; border-top: 1px solid var(--line-soft); }
.set-table th { background: none; padding: 4px 6px; }
.set-table input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--primary); }
.set-grid { display: grid; grid-template-columns: 1fr; gap: 14px; margin-top: 18px; }
.set-foot { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line-soft); }

/* Station */
.tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
.tabs a { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 9px 14px; text-decoration: none; color: #4c4436; font-weight: 600; font-size: 14px; }
.tabs a span.n { color: var(--muted); font-weight: 500; }
.tabs a.on { background: var(--brown); border-color: var(--brown); color: #fff; } .tabs a.on span.n { color: #e8dec7; }
.count { border-radius: 999px; padding: 1px 8px; font-size: 12px; background: #efebe4; color: #7d725f; }
.count.has { background: var(--gold); color: var(--brown); }
.st-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.serving { background: var(--brown); color: #fff; border: 1px solid #5b4a2d; border-radius: 16px; padding: 22px; }
.serving .k { color: var(--gold-2); text-transform: uppercase; letter-spacing: .08em; font-weight: 700; font-size: 13px; margin: 0; }
.serving .num { font-size: 60px; font-weight: 800; letter-spacing: .03em; margin: 14px 0 0; line-height: 1; }
.serving .who { font-size: 20px; font-weight: 600; margin: 10px 0 0; }
.serving .meta { color: #e8dec7; font-size: 13px; margin: 4px 0 0; }
.serving .btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
.serving .btn.gold { background: var(--gold-2); color: var(--brown); } .serving .btn.gold:hover { background: var(--gold); }
.serving .btn.cream { background: var(--cream); color: var(--brown); }
.serving .btn.bare { background: transparent; color: #f4c3cc; }
.serving .send { margin-top: 16px; }
.serving .send p { color: #cbbd9d; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; margin: 0 0 8px; }
.serving .send button { border: 1px solid #5c4b2d; background: transparent; color: #e8dec7; border-radius: 999px; padding: 6px 12px; font-size: 13px; margin: 0 4px 6px 0; }
.serving .send button:hover { border-color: var(--gold-2); color: #fff; }
.serving + .serving { margin-top: 0; }
.callnext { width: 100%; min-height: 80px; border-radius: 16px; border: 0; background: var(--gold); color: var(--brown); font-size: 22px; font-weight: 800; margin-top: 18px; }
.callnext:hover { background: var(--gold-2); } .callnext:disabled { opacity: .5; cursor: default; }
.hint { text-align: center; color: var(--muted); font-size: 13px; margin: 8px 0 0; }
.wlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.wlist li { display: flex; align-items: center; gap: 10px; border: 1px solid #e8dfce; border-radius: 12px; padding: 8px 12px; }
.wlist li.missed { border-color: #f3cdd4; background: #fff7f8; }
.wlist .pos { width: 22px; text-align: right; color: var(--primary); font-weight: 700; }
.wlist .who { flex: 1; min-width: 0; }
.wlist .who b { display: block; font-size: 18px; }
.wlist .who span { color: #5e5443; font-size: 13px; }
.wlist .t { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }

/* TV display */
body.tv { background: #1f1a12; color: #fff; overflow: hidden; }
.tv-app { height: 100vh; min-height: 560px; display: flex; flex-direction: column; }
.tv-head { display: flex; justify-content: space-between; align-items: center; background: var(--brown); border-bottom: 1px solid var(--brown-2); padding: 1.4vh 2.5vw; }
.tv-head .brand img { height: 7vh; width: auto; }
.tv-head .brand small { font-size: 1.1vw; letter-spacing: .12em; }
.tv-head .brand b { font-size: 1.9vw; }
.tv-clock { text-align: right; } .tv-clock b { display: block; font-size: 2.6vw; line-height: 1; } .tv-clock span { color: #e8dec7; font-size: 1vw; }
.tv-body { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); gap: 1.5vw; padding: 1.5vw; }
.tv-left { display: flex; flex-direction: column; gap: 1.5vw; min-height: 0; }
.hero { flex: 1.15; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; border-radius: 1.5vw; border: .25vw solid var(--brown-2); background: var(--brown-3); transition: background .7s, border-color .7s; }
.hero.fresh { background: #4a3612; border-color: var(--gold-2); animation: pulse 1.6s ease-out 6; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(240,200,100,.55); } 50% { box-shadow: 0 0 0 1.4vw rgba(240,200,100,0); } }
.hero .k { color: var(--gold-2); text-transform: uppercase; letter-spacing: .2em; font-weight: 700; font-size: 1.6vw; margin: 0; }
.hero .num { max-width: 100%; white-space: nowrap; overflow: hidden; font-size: 11.5vw; font-weight: 800; line-height: 1; margin: 1vh 0 0; letter-spacing: .03em; }
.hero .go { font-size: 2.2vw; color: #f4e8c7; font-weight: 600; margin: 2vh 0 0; } .hero .go b { color: #fff; }
.tiles { flex: 1; min-height: 0; display: grid; gap: 1vw; grid-auto-rows: 1fr; }
.tile { border: 1px solid var(--brown-2); background: var(--brown-3); border-radius: 1vw; padding: 1vh 1vw; min-width: 0; display: flex; flex-direction: column; justify-content: center; min-height: 0; }
.tile p { margin: 0; } .tile .s { color: #cbbd9d; font-size: 1.15vw; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .tile .s b { color: var(--gold-2); }
.tile .num { white-space: nowrap; overflow: hidden; font-size: 4.6vw; font-weight: 800; margin-top: .5vh; } .tile .num.none { color: #5c4b2d; }
.tv-next { border: 1px solid var(--brown-2); background: var(--brown-3); border-radius: 1.5vw; padding: 1.4vw; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.tv-next h2 { margin: 0; color: var(--gold-2); text-transform: uppercase; letter-spacing: .14em; font-size: 1.6vw; }
.reg-call { display: flex; justify-content: space-between; align-items: baseline; background: #4a3612; border-radius: .8vw; padding: 1vh 1.2vw; margin-top: 1.2vh; } .reg-call span { color: #f4e8c7; font-size: 1.3vw; } .reg-call b { font-size: 2.6vw; }
.nl { border-bottom: 1px solid #3a3022; padding: 1vh 0; } .nl:last-child { border: 0; }
.nl .h { display: flex; justify-content: space-between; color: #cbbd9d; font-size: 1.1vw; }
.nl .l { display: flex; flex-wrap: wrap; gap: .5vw; margin-top: .6vh; align-items: center; }
.nl .l b { background: #3a3022; border-radius: .5vw; padding: .3vh .55vw; font-size: 2.1vw; } .nl .l i { color: #5c4b2d; font-style: normal; font-size: 1.5vw; } .nl .l span { color: #cbbd9d; font-size: 1.2vw; }
.tv-foot { display: flex; align-items: center; gap: 12px; background: var(--brown); border-top: 1px solid var(--brown-2); padding: 1.2vh 0; overflow: hidden; }
.ticker { flex: 1; overflow: hidden; white-space: nowrap; color: #f4e8c7; font-size: 1.35vw; }
.ticker span { display: inline-block; padding-left: 100%; animation: marquee 28s linear infinite; }
@keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-100%); } }
.tv-ctl { display: flex; gap: 6px; padding-right: 1.5vw; opacity: .6; } .tv-ctl:hover { opacity: 1; }
.tv-ctl button, .tv-ctl a { border: 0; background: transparent; color: #fff; border-radius: 999px; padding: 6px 10px; font-size: 13px; text-decoration: none; } .tv-ctl button:hover, .tv-ctl a:hover { background: var(--brown-2); }
.sound-btn { position: fixed; right: 2vw; bottom: 9vh; background: var(--gold); color: var(--brown); border: 0; border-radius: 16px; padding: 16px 22px; font-weight: 800; font-size: 18px; box-shadow: 0 20px 40px rgba(0,0,0,.4); }
.tv-body.video { grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 1.2vw; padding: 1.2vw; }
.tv-body.video .tv-left, .tv-right { display: flex; flex-direction: column; gap: 1.2vw; min-height: 0; }
.vid { position: relative; flex: 1; min-height: 0; overflow: hidden; border-radius: 1.2vw; border: 1px solid var(--brown-2); background: #000; }
.vid iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.vid-over { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(31,26,18,.85); text-align: center; }
.vid-over > div { border-radius: 1.5vw; border: .25vw solid var(--gold-2); background: #4a3612; padding: 4vh 4vw; animation: pulse 1.6s ease-out 6; }
.vid-over .k { color: var(--gold-2); text-transform: uppercase; letter-spacing: .2em; font-weight: 700; font-size: 1.6vw; margin: 0; }
.vid-over .num { white-space: nowrap; font-size: 10vw; font-weight: 800; line-height: 1; margin: 1vh 0 0; } .vid-over .go { font-size: 2vw; color: #f4e8c7; font-weight: 600; margin: 2vh 0 0; } .vid-over .go b { color: #fff; }
.hero.compact { flex: none; padding: 2vh 1vw; } .hero.compact .k { font-size: 1.2vw; } .hero.compact .num { font-size: 6.4vw; } .hero.compact .go { font-size: 1.4vw; }
.tiles.small { flex: none; } .tiles.small .tile { padding: 1.2vh .7vw; } .tiles.small .tile .s { font-size: .95vw; } .tiles.small .tile .num { font-size: 3vw; }
.tv-right .tv-next { flex: 1; }
.yt-hint { font-size: 12px; font-weight: 600; margin: 0; } .yt-hint.ok { color: var(--ok); } .yt-hint.err { color: #b4233c; }
@media (prefers-reduced-motion: reduce) { .ticker span, .hero.fresh, .vid-over > div { animation: none; } }

/* Sync */
.badge-device.ok { background: #33421f; color: #cfe6b8; } .badge-device.bad { background: var(--bad-bg); color: var(--bad); }
.sync-banner { background: var(--bad-bg); color: var(--bad); border: 1px solid #f3cdd4; border-radius: 12px; padding: 10px 14px; font-size: 13px; font-weight: 600; line-height: 1.5; margin: 0 0 16px; }
.sync-result { border-radius: 12px; padding: 10px 14px; font-size: 13px; font-weight: 600; line-height: 1.5; margin: 0; } .sync-result.ok { background: var(--ok-bg); color: var(--ok); } .sync-result.err { background: var(--bad-bg); color: var(--bad); }
.wrap a { color: var(--primary); font-weight: 600; }

/* Toast */

    const toFirstCall = visits.map((visit) => minutes(visit.steps[0]?.queuedAt, visit.steps[0]?.calledAt));
    const inClinic = visits.map((visit) => minutes(visit.createdAt, finishedAt(visit)));
    const arrivalsByHour = new Map();
    visits.forEach((visit) => { const hour = hourOf(visit.createdAt); arrivalsByHour.set(hour, [...(arrivalsByHour.get(hour) ?? []), visit]); });
    const hours = [...arrivalsByHour.keys()].sort((a, b) => a - b);
    const busiest = hours.reduce((best, hour) => (best === null || arrivalsByHour.get(hour).length > arrivalsByHour.get(best).length ? hour : best), null);
    const summary = [
        ["The Heart Specialists Clinic — Queue Summary Report"],
        ["Date", longDate.format(now)],
        ["Generated", formatTime(now)],
        [],
        ["PATIENT FLOW", "Count"],
        ["Queue numbers issued", visits.length],
        ["Registered", count(visits, (v) => isRegistered(v))],
        ["Completed", count(active, (v) => visitStatus(v) === "completed")],
        ["Still in clinic", count(active, (v) => !["completed", "cancelled"].includes(visitStatus(v)))],
        ["Missed call (not yet back in line)", count(active, (v) => visitStatus(v) === "missed")],
        ["Left before registration", count(visits, (v) => v.cancelled && !isRegistered(v))],
        ["Cancelled after registration", count(visits, (v) => v.cancelled && isRegistered(v))],
        [],
        ["PATIENT MIX (excluding cancelled)", "Count"],
        ["Walk-in (W)", count(active, (v) => v.kind === "W")],
        ["Scheduled (S)", count(active, (v) => v.kind === "S")],
        ["New patients", count(active, (v) => v.newPatient === true)],
        ["Returning patients", count(active, (v) => v.newPatient !== true)],
        ["Priority lane", count(active, (v) => v.priority)],
        ["QR self check-in", count(active, (v) => v.source === "self")],
        [],
        ["WAITING TIMES (minutes)", "Average", "Longest"],
        ["Arrival → registration", average(toRegister), longest(toRegister)],
        ["Registration → first call", average(toFirstCall), longest(toFirstCall)],
        ["Total time in clinic (completed visits)", average(inClinic), longest(inClinic)],
        [],
        ["Busiest hour", busiest === null ? "—" : `${hourLabel(busiest)} – ${hourLabel((busiest + 1) % 24)}`, busiest === null ? null : arrivalsByHour.get(busiest).length],
    ];
    const stationRows = [["Code", "Station", "Service", "Patients queued", "Served", "Waiting now", "Missed", "Avg wait (min)", "Longest wait (min)", "Avg service time (min)"]];
    state.settings.stations.forEach((station) => {
        const steps = active.flatMap((visit) => visit.steps.filter((step) => step.station === station.code && step.status !== "pending"));
        if (!steps.length && !station.active)
            return;
        const waits = steps.map((step) => minutes(step.queuedAt, step.calledAt));
        stationRows.push([
            station.code, station.name, station.service[0].toUpperCase() + station.service.slice(1), steps.length,
            steps.filter((step) => step.status === "done").length, steps.filter((step) => step.status === "waiting").length, steps.filter((step) => step.status === "missed").length,
            average(waits), longest(waits), average(steps.map((step) => minutes(step.calledAt, step.doneAt))),
        ]);
    });
    const hourRows = [["Hour", "Queue numbers issued", "Walk-in", "Scheduled", "New patients", "Priority lane"]];
    hours.forEach((hour) => {
        const list = arrivalsByHour.get(hour);
        hourRows.push([`${hourLabel(hour)} – ${hourLabel((hour + 1) % 24)}`, list.length, count(list, (v) => v.kind === "W"), count(list, (v) => v.kind === "S"), count(list, (v) => v.newPatient === true), count(list, (v) => v.priority)]);
    });
    if (hours.length)
        hourRows.push(["Total", visits.length, count(visits, (v) => v.kind === "W"), count(visits, (v) => v.kind === "S"), count(visits, (v) => v.newPatient === true), count(visits, (v) => v.priority)]);
    const patientRows = [["Queue no.", "Patient", "Mobile", "Type", "New patient", "Priority", "Source", "Status", "Services", "Arrived", "Registered", "First called", "Finished", "Wait to register (min)", "Wait for first call (min)", "Time in clinic (min)", "Notes"]];
    visits.forEach((visit, index) => {
        patientRows.push([
            currentLabel(visit), visit.name, visit.mobile, visit.kind === "S" ? "Scheduled" : "Walk-in", visit.newPatient ? "Yes" : "No", visit.priority ? "Yes" : "",
            visit.source === "self" ? "QR check-in" : "Front desk", STATUS_LABEL[visitStatus(visit)], visit.steps.map((step) => stationName(state, step.station)).join(" → "),
            time(visit.createdAt), time(visit.registeredAt), time(visit.steps[0]?.calledAt), time(finishedAt(visit)),
            toRegister[index], toFirstCall[index], inClinic[index], visit.notes,
        ]);
    });
    return [
        { name: "Summary", rows: summary, widths: [40, 30, 12] },
        { name: "By station", rows: stationRows, widths: [8, 28, 14, 16, 10, 13, 9, 15, 18, 22] },
        { name: "By hour", rows: hourRows, widths: [22, 22, 10, 11, 14, 13] },
        { name: "Patient list", rows: patientRows, widths: [11, 26, 15, 11, 12, 9, 13, 14, 40, 10, 11, 12, 10, 20, 22, 19, 30] },
    ];
}
/** Builds the workbook and downloads it as THSC-Queue-Report-YYYY-MM-DD.xlsx. */
function downloadQueueReport(xlsx, state, now) {
    const book = xlsx.utils.book_new();
    buildQueueReport(state, now).forEach((sheet) => {
        const ws = xlsx.utils.aoa_to_sheet(sheet.rows.map((row) => row.map((cell) => (cell === null ? "" : cell))));
        ws["!cols"] = sheet.widths.map((wch) => ({ wch }));
        xlsx.utils.book_append_sheet(book, ws, sheet.name);
    });
    xlsx.writeFile(book, `THSC-Queue-Report-${state.day}.xlsx`);
}

  const KEY = "thsc-queue-standalone-v1";
  const STATION_KEY = "thsc-queue-standalone-station";
  const SERVER_KEY = "thsc-queue-server";
  const PIN_KEY = "thsc-queue-pin";
  /** The clinic's Queue Board server. Every computer that uses the same sync server shares one queue. */
  const DEFAULT_SERVER = "https://queueing-system-self.vercel.app";
  const POLL_MS = 2000;
  const channel = "BroadcastChannel" in window ? new BroadcastChannel("thsc-queue-standalone") : null;
  const app = document.getElementById("app");
  const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const $ = (selector) => document.querySelector(selector);
  let storageOk = true;

  const readSetting = (key) => { try { return localStorage.getItem(key); } catch { return null; } };
  const writeSetting = (key, value) => { try { if (value === null) localStorage.removeItem(key); else localStorage.setItem(key, value); } catch { storageOk = false; } };
  /** Sync server address for this computer; an empty string keeps the queue on this computer only. */
  const syncServer = () => readSetting(SERVER_KEY) ?? DEFAULT_SERVER;
  const serverHost = (url) => { try { return new URL(url).host; } catch { return url; } };

  // ---------- State: shared through the sync server, or kept in this browser ("This computer only") ----------
  // mode: "connecting" until the server first answers, then "server"; "local" keeps the queue in this browser.
  const sync = { mode: syncServer() ? "connecting" : "local", staff: false, online: true, error: "", warning: "", version: null };
  const locked = () => sync.mode === "server" && !sync.staff;
  let actionCount = 0;

  function loadLocal() {
    try {
      const raw = localStorage.getItem(KEY);
      return ensureDay(raw ? JSON.parse(raw) : null, Date.now());
    } catch {
      storageOk = false;
      return ensureDay(state ?? null, Date.now());
    }
  }
  let state = null;
  if (sync.mode === "local") state = loadLocal();

  async function request(init, since, pin = readSetting(PIN_KEY), server = syncServer()) {
    const url = `${server}/api/queue${since === null || since === undefined ? "" : `?since=${since}`}`;
    const response = await fetch(url, { ...init, cache: "no-store", headers: { "Content-Type": "application/json", ...(pin ? { "x-queue-pin": pin } : {}) } });
    const body = await response.json().catch(() => ({ error: `The sync server answered with error ${response.status}.` }));
    return { response, body };
  }

  function receive(body) {
    sync.staff = Boolean(body.staff);
    if (typeof body.version === "number") sync.version = body.version;
    if (body.state) state = body.state;
  }

  function useLocal(warning) {
    sync.mode = "local";
    sync.warning = warning;
    sync.error = "";
    state = loadLocal();
    mount();
  }

  let pollTimer;
  async function poll() {
    clearTimeout(pollTimer);
    if (sync.mode === "local") return;
    const before = `${sync.mode}|${sync.staff}`;
    const started = actionCount;
    let changed = false;
    try {
      const { response, body } = await request(undefined, state ? sync.version : null);
      // Without shared storage the server cannot sync computers: keep a queue on this computer and say why.
      if (body.mode === "local" || (sync.mode === "connecting" && response.status === 404)) {
        useLocal(`The sync server ${serverHost(syncServer())} has no shared storage set up, so this computer is keeping its own queue. Set up shared storage on the server (see the README) and reopen this file, or choose This computer only in Sync setup.`);
        return;
      }
      sync.online = true;
      if (!response.ok) sync.error = body.error || `The sync server answered with error ${response.status}.`;
      else if (started === actionCount) {
        // Skip a poll that raced an action on this computer; the action's answer is newer.
        sync.error = "";
        sync.mode = "server";
        changed = Boolean(body.state);
        receive(body);
      }
    } catch {
      sync.online = false;
      sync.error = `No connection to the sync server (${serverHost(syncServer())}). Check the internet connection. Retrying…`;
    }
    if (`${sync.mode}|${sync.staff}` !== before || (view === "connecting" && state)) mount();
    else if (changed) update();
    else refreshSync();
    pollTimer = setTimeout(poll, POLL_MS);
  }

  async function dispatch(action, success) {
    let result;
    if (sync.mode === "local") {
      const applied = applyAction(loadLocal(), action, Date.now());
      result = applied.result;
      if (result.ok) {
        state = applied.state;
        try { localStorage.setItem(KEY, JSON.stringify(state)); } catch { storageOk = false; }
        channel?.postMessage("changed");
      }
    } else if (sync.mode !== "server") {
      result = { ok: false, error: "Still connecting to the sync server. Try again in a moment." };
    } else {
      actionCount += 1;
      try {
        const { body } = await request({ method: "POST", body: JSON.stringify({ action }) });
        receive(body);
        result = body.result ?? { ok: false, error: body.error || "The action could not be saved." };
      } catch {
        sync.online = false;
        result = { ok: false, error: "No connection to the sync server, so this was not saved. Check the internet connection and try again." };
      }
    }
    if (result.ok || sync.mode === "server") update();
    if (!result.ok) { toast(result.error, true); return result; }
    if (success) toast(typeof success === "function" ? success(result) : success);
    return result;
  }
  const refresh = () => { if (sync.mode !== "local") return; state = loadLocal(); update(); };
  if (channel) channel.onmessage = refresh;
  window.addEventListener("storage", (event) => { if (event.key === KEY) refresh(); });
  setInterval(() => { if (sync.mode === "local" && ensureDay(state, Date.now()) !== state) refresh(); }, 30000);

  function syncLabel() {
    if (sync.mode === "local") return ["This computer only", "", "Queue data is saved in this browser on this computer."];
    if (!sync.online || sync.error) return ["Reconnecting…", "bad", sync.error];
    if (sync.mode === "connecting") return ["Connecting…", "", ""];
    return [`Synced · ${serverHost(syncServer())}`, "ok", "Every computer using this sync server shares this queue."];
  }
  function refreshSync() {
    const [text, tone, title] = syncLabel();
    document.querySelectorAll(".sync-badge").forEach((el) => { el.textContent = text; el.className = `badge-device sync-badge ${tone}`; el.title = title; });
    const banner = $("#sync-banner");
    if (banner) { banner.textContent = sync.error || sync.warning; banner.classList.toggle("hidden", !(sync.error || sync.warning)); }
  }

  let toastTimer;
  function toast(text, error = false) {
    const el = $("#toast");
    el.textContent = text;
    el.className = `toast${error ? " err" : ""}`;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.add("hidden"), error ? 6000 : 3500);
  }

  // ---------- Routing: #desk, #station/C1, #display ----------
  let view = null;
  function route() {
    const [name, arg] = location.hash.replace(/^#/, "").split("/");
    return { name: ["station", "display", "setup"].includes(name) ? name : "desk", arg: arg ? decodeURIComponent(arg) : "" };
  }
  function mount() {
    const r = route();
    if (r.name === "setup") { view = "setup"; document.body.className = ""; document.title = "Sync Setup · THSC Queue Board"; mountSetup(); refreshSync(); return; }
    if (!state) { view = "connecting"; document.body.className = ""; document.title = "THSC Queue Board"; mountConnecting(); refreshSync(); return; }
    if (r.name !== "display" && locked()) { view = "gate"; document.body.className = ""; document.title = "Staff PIN · THSC Queue Board"; mountGate(); refreshSync(); return; }
    view = r.name;
    document.body.className = view === "display" ? "tv" : "";
    document.title = { desk: "Front Desk · THSC Queue Board", station: "Stations · THSC Queue Board", display: "TV Display · THSC Queue Board" }[view];
    if (view === "display") mountDisplay(); else mountStaff();
    update();
  }
  window.addEventListener("hashchange", mount);
  function update() {
    refreshSync();
    if (view === "desk") updateDesk();
    else if (view === "station") updateStation();
    else if (view === "display") updateDisplay();
  }

          <div class="top-actions"><span class="badge-device sync-badge"></span>${view === "desk" ? `<button class="btn sm on-dark" data-act="openSettings">Settings</button>` : ""}</div>
        </div>
        <nav class="nav">${nav.map(([key, href, label]) => `<a href="${href}" class="${view === key ? "on" : ""}">${label}</a>`).join("")}<button data-act="openTv">TV display ↗</button><button data-act="openPoster">Check-in QR ↗</button><a href="#setup">Sync setup</a></nav>
      </div></header>
      <main class="wrap"><p class="sync-banner hidden" id="sync-banner" role="alert"></p><div id="main"></div></main>`;
    if (view === "desk") mountDesk(); else $("#main").innerHTML = `<div id="station"></div>`;
  }

  const plainHeader = (title) => `<header class="top"><div class="top-in" style="padding-bottom:12px"><div class="top-row">
      <div class="brand"><img src="${LOGO}" alt=""><div><small>THE HEART SPECIALISTS CLINIC</small><b>Queue Board · ${title}</b></div></div>
      <div class="top-actions"><span class="badge-device sync-badge"></span></div></div></div></header>`;

  function mountConnecting() {
    app.innerHTML = `${plainHeader("Connecting")}<main class="wrap" style="max-width:640px"><p class="sync-banner hidden" id="sync-banner" role="alert"></p>
      <section class="panel"><div class="panel-b"><p style="margin:0;font-size:16px">Connecting to the sync server <b>${esc(serverHost(syncServer()))}</b>…</p>
      <p style="color:var(--muted);font-size:13px">The queue appears as soon as the server answers. <a href="#setup">Sync setup</a></p></div></section></main>`;
  }

  function mountGate() {
    const rejected = Boolean(readSetting(PIN_KEY));
    app.innerHTML = `${plainHeader("Staff access")}<main class="wrap" style="max-width:460px"><p class="sync-banner hidden" id="sync-banner" role="alert"></p>
      <section class="panel"><div class="panel-h"><div><h2>Enter the staff PIN</h2><p>Staff screens show patient names, so they are protected. The PIN is remembered on this computer.</p></div></div>
      <div class="panel-b"><form id="pin-form" style="display:grid;gap:12px">
        <input type="password" id="pin" inputmode="numeric" autocomplete="current-password" placeholder="PIN" aria-label="Staff PIN" required>
        ${rejected ? `<p style="margin:0;color:#b4233c;font-weight:600;font-size:14px">That PIN was not accepted.</p>` : ""}
        <button class="btn" type="submit" style="min-height:44px">Unlock</button>
      </form>
      <p style="color:var(--muted);font-size:13px;margin:14px 0 0">The <a href="#display">TV display</a> needs no PIN. · <a href="#setup">Sync setup</a></p></div></section></main>`;
    $("#pin").focus();
    $("#pin-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const pin = $("#pin").value.trim();
      if (!pin) return;
      writeSetting(PIN_KEY, pin);
      sync.version = null;
      // A wrong PIN leaves this screen up; show it again with the "not accepted" message.
      void poll().then(() => { if (view === "gate") mountGate(); });
    });

  /** Turns what staff type ("192.168.1.10:3000", "https://…/queue") into an origin, or null if it is not an address. */
  function normalizeServer(input) {
    const value = String(input ?? "").trim();
    if (!value) return null;
    const lan = /^(localhost|\d{1,3}(\.\d{1,3}){3})(:\d+)?(\/|$)/.test(value);
    try { return new URL(/^https?:\/\//i.test(value) ? value : `${lan ? "http" : "https"}://${value}`).origin; } catch { return null; }
  }

  async function checkServer(server, pin) {
    try {
      const { response, body } = await request(undefined, null, pin || null, server);
      if (!body || !body.mode) return [false, `That address answered, but it is not a Queue Board server (error ${response.status}). Check the address.`];
      if (body.mode === "local") return [false, "The server is running, but shared storage is not set up, so computers would not sync. Add the Upstash Redis database and QUEUE_STAFF_PIN to the server (see the README), then redeploy."];
      if (body.error) return [false, body.error];
      if (pin && !body.staff) return [false, "Connected, but that staff PIN was not accepted."];
      return [true, pin ? "Connected, and the staff PIN works. The shared queue is ready." : "Connected. The shared queue is ready on this server."];
    } catch {
      return [false, "Could not reach the server. Check the address and this computer's internet connection. If the address is right, the server needs the latest Queue Board update so this file can connect."];
    }
  }

          <div style="display:grid;gap:8px;border:1px solid #e8dfce;border-radius:12px;padding:14px">
            <label class="field">Spoken announcements on the TV<em>The chime plays first, then the queue number is read out in the language you choose.</em>
              <select data-set="announceLanguage">${[["en+fil", "English, then Tagalog"], ["en", "English only"], ["fil", "Tagalog only"]].map(([v, l]) => `<option value="${v}" ${(draft.announceLanguage ?? "en+fil") === v ? "selected" : ""}>${l}</option>`).join("")}</select></label>
            <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button type="button" class="btn sm outline" data-act="testVoice">▶ Test announcement</button><span style="font-size:12px;color:var(--muted)">Plays on this computer.</span></div>
            <p class="yt-hint" id="voice-hint"></p>
          </div>
          <div style="display:grid;gap:8px;border:1px solid #e8dfce;border-radius:12px;padding:14px">
            <label class="field">YouTube on the TV while patients wait<em>Paste the clinic's YouTube channel ID (starts with UC), a playlist link or a video link. Leave empty to show the queue only. Needs internet.</em><input type="text" maxlength="300" value="${esc(draft.youtube ?? "")}" placeholder="e.g. https://www.youtube.com/playlist?list=PL…" data-set="youtube" id="yt-input"></label>
            <p class="yt-hint" id="yt-hint"></p>
            <label class="check" style="border:0;padding:0"><input type="checkbox" ${draft.videoSound ? "checked" : ""} data-set="videoSound"><span>Play the video's sound <small>Muted automatically while queue numbers are announced</small></span></label>
          </div>
        </div>
        <div class="set-foot"><button class="btn danger" data-act="resetDay">Clear today's queue</button><button class="btn" data-act="saveSettings">Save settings</button></div>
      </div></section></div>`;
    box.querySelectorAll("[data-set]").forEach((input) => input.addEventListener(input.type === "checkbox" || input.tagName === "SELECT" ? "change" : "input", () => {
      const field = input.dataset.set;
      const value = input.type === "checkbox" ? input.checked : field === "code" ? input.value.toUpperCase() : input.value;
      if (input.dataset.index !== undefined) draft.stations[Number(input.dataset.index)][field] = value; else draft[field] = value;
      if (field === "code") input.value = value;
      if (field === "youtube") showYouTubeHint();
      if (field === "announceLanguage") showVoiceHint();
    }));
    showYouTubeHint();
    showVoiceHint();
  }

  function showVoiceHint() {
    const hint = $("#voice-hint");
    if (!hint || !draft) return;
    const tagalog = (draft.announceLanguage ?? "en+fil") !== "en";
    const voice = tagalog && filipinoVoice();
    hint.className = `yt-hint ${!tagalog || voice ? "ok" : "err"}`;
    hint.textContent = !tagalog || !("speechSynthesis" in window) ? "" : voice ? `✓ Filipino voice on this computer: ${voice.name}` : NO_FILIPINO_VOICE;
  }
  if ("speechSynthesis" in window) speechSynthesis.addEventListener?.("voiceschanged", () => showVoiceHint());

  function showYouTubeHint() {
    const hint = $("#yt-hint");
    if (!hint || !draft) return;
    const video = parseYouTube(draft.youtube);
    hint.className = `yt-hint ${video && "error" in video ? "err" : "ok"}`;
    hint.textContent = !video ? "" : "error" in video ? video.error : `✓ ${video.kind === "channel" ? "Channel uploads" : video.kind === "playlist" ? "Playlist" : "Video"} will play on the TV, muted and on repeat.`;
  }

  // ---------- Station ----------
  function currentStationCode() {
    const stations = state.settings.stations.filter((s) => s.active);
    let wanted = route().arg;
    if (!wanted) { try { wanted = localStorage.getItem(STATION_KEY) || ""; } catch { wanted = ""; } }
    return stations.find((s) => s.code === wanted)?.code ?? stations[0]?.code;
  }
  function updateStation() {
    const box = $("#station");
    const stations = state.settings.stations.filter((s) => s.active);
    const code = currentStationCode();
    const station = stations.find((s) => s.code === code);
    if (!station) { box.innerHTML = `<p class="empty">No active stations. Add one in Front desk → Settings.</p>`; return; }
    try { localStorage.setItem(STATION_KEY, station.code); } catch { /* not saved */ }
    const now = Date.now();
    const serving = servingAt(state, station.code);
    const waiting = waitingFor(state, station.code);
    const missed = state.visits.filter((v) => { const s = currentStep(v); return !v.cancelled && s?.station === station.code && s.status === "missed"; });
    const next = waiting[0];
    const others = stations.filter((s) => s.code !== station.code);
    box.innerHTML = `
      <nav class="tabs" aria-label="Choose station">${stations.map((s) => { const n = waitingFor(state, s.code).length; return `<a href="#station/${encodeURIComponent(s.code)}" class="${s.code === station.code ? "on" : ""}"><b class="mono">${esc(s.code)}</b><span class="n">${esc(s.name)}</span><span class="count ${n ? "has" : ""}">${n}</span></a>`; }).join("")}</nav>
      <div class="st-grid">
        <div>
          <section class="serving"><p class="k">Now serving · ${esc(station.name)}</p>
            ${serving.length ? serving.map((v) => {
              const step = currentStep(v);
              const upcoming = v.steps[v.steps.indexOf(step) + 1];
              return `<div><p class="num mono">${esc(ticketLabel(v, station.code))}</p>
                <p class="who">${esc(v.name)}${v.newPatient ? ` <span class="tag new" style="vertical-align:middle">New patient</span>` : ""}${v.priority ? ` <span class="tag prio" style="vertical-align:middle">Priority</span>` : ""}</p>
                <p class="meta">Called ${step.calledAt ? formatTime(step.calledAt) : ""} · ${formatWait(minutesSince(step.calledAt, now))} ago${step.calls > 1 ? ` · called ${step.calls}×` : ""}${v.notes ? ` · ${esc(v.notes)}` : ""}</p>
                <div class="btns"><button class="btn cream" data-act="recall" data-id="${v.id}">📢 Call again</button><button class="btn bare" data-act="miss" data-id="${v.id}">Did not respond</button><button class="btn gold" data-act="complete" data-id="${v.id}">✓ ${upcoming ? `Complete · next ${esc(upcoming.station)}` : "Complete visit"}</button></div>
                ${others.length ? `<div class="send"><p>Complete and send to</p>${others.map((s) => `<button data-act="complete" data-id="${v.id}" data-send="${esc(s.code)}">→ <b class="mono">${esc(s.code)}</b> ${esc(s.name)}</button>`).join("")}</div>` : ""}</div>`;
            }).join(`<hr style="border:0;border-top:1px solid #4a3d27;margin:18px 0">`) : `<p style="color:#e8dec7;font-size:17px;margin:20px 0 0">No patient called yet.</p>`}
          </section>
          <button class="callnext" data-act="callNext" data-station="${esc(station.code)}" ${next ? "" : "disabled"}>🔔 ${next ? `Call next · <span class="mono">${esc(ticketLabel(next, station.code))}</span>` : "No one waiting"}</button>
          ${serving.length && next ? `<p class="hint">Calling the next patient marks ${esc(ticketLabel(serving[0], station.code))} as complete.</p>` : ""}
        </div>
        <div class="col">
          <section class="panel"><div class="panel-h"><div><h2>Waiting for ${esc(station.name)}</h2><p>Priority lane patients are called first, then in arrival order.</p></div></div>
            <div class="panel-b">${waiting.length ? `<ol class="wlist">${waiting.map((v, i) => `<li><span class="pos">${i + 1}</span><div class="who"><b class="mono">${esc(ticketLabel(v, station.code))}</b><span>${esc(v.name)}${v.newPatient ? ` <span class="tag new">New</span>` : ""}${v.priority ? ` <span class="tag prio">Priority</span>` : ""}</span></div><span class="t">${formatWait(minutesSince(currentStep(v)?.queuedAt ?? null, now))}</span><button class="btn sm outline" data-act="callOne" data-station="${esc(station.code)}" data-id="${v.id}">Call</button></li>`).join("")}</ol>` : `<p class="empty">The line is empty.</p>`}</div>
          </section>
          ${missed.length ? `<section class="panel"><div class="panel-h"><div><h2>Missed calls</h2><p>Patients who did not respond. Call again or return them to the line.</p></div></div><div class="panel-b"><ul class="wlist">${missed.map((v) => `<li class="missed"><div class="who"><b class="mono">${esc(ticketLabel(v, station.code))}</b><span>${esc(v.name)}</span></div><button class="btn sm outline" data-act="callOne" data-station="${esc(station.code)}" data-id="${v.id}">Call again</button><button class="btn sm ghost" data-act="requeue" data-id="${v.id}">Back to line</button></li>`).join("")}</ul></div></section>` : ""}
        </div>
      </div>`;
  }

  // ---------- TV display ----------
  const clock = new Intl.DateTimeFormat("en-PH", { timeZone: TIME_ZONE, hour: "numeric", minute: "2-digit" });
  const longDate = new Intl.DateTimeFormat("en-PH", { timeZone: TIME_ZONE, weekday: "long", month: "long", day: "numeric", year: "numeric" });
  let sound = false;
  let audio = null;
  let seen;
  let tvTimer;

  let mountedVideo = null;
  let unmuteTimer;
  const currentVideo = () => { const v = parseYouTube(state.settings.youtube); return v && !("error" in v) ? v.src : null; };
  const yt = (func, args) => youtubeCommand(document.getElementById("yt"), func, args);
  // YouTube refuses to play without a referring website (error 153), and this file opened from disk has none.
  // From disk, load the player through the sync server's relay page so YouTube sees that site instead.
  const videoFrameSrc = (src) => (location.protocol === "file:" ? `${syncServer() || DEFAULT_SERVER}/youtube-frame.html#${encodeURIComponent(src)}` : src);

  function mountDisplay() {
    seen = state.announcements[state.announcements.length - 1]?.id ?? null;
    mountedVideo = currentVideo();
    const body = mountedVideo
      ? `<div class="tv-body video">
        <div class="tv-left"><div class="vid"><iframe id="yt" src="${esc(videoFrameSrc(mountedVideo))}" title="The Heart Specialists Clinic videos" allow="autoplay; encrypted-media; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin"></iframe><div class="vid-over hidden" id="vid-over"></div></div><section class="tiles small" id="tiles"></section></div>
        <div class="tv-right"><section class="hero compact" id="hero"></section><section class="tv-next"><h2>Next in line</h2><div id="reg-call"></div><div id="next" style="margin-top:1.2vh;min-height:0;overflow:hidden"></div></section></div>
      </div>`
      : `<div class="tv-body">
        <div class="tv-left"><section class="hero" id="hero"></section><section class="tiles" id="tiles"></section></div>
        <section class="tv-next"><h2>Next in line</h2><div id="reg-call"></div><div id="next" style="margin-top:1.2vh;min-height:0;overflow:hidden"></div></section>
      </div>`;
    app.innerHTML = `<div class="tv-app">
      <header class="tv-head"><div class="brand"><img src="${LOGO}" alt=""><div><small>THE HEART SPECIALISTS CLINIC</small><b>Queue Board</b></div></div><div class="tv-clock"><b id="tv-time"></b><span id="tv-date"></span></div></header>
      ${body}
      <footer class="tv-foot"><div class="ticker"><span id="ticker"></span></div><div class="tv-ctl"><button data-act="sound" id="sound-toggle">🔇 Sound off</button><button data-act="fullscreen">⛶ Full screen</button><span class="badge-device sync-badge" style="align-self:center"></span><a href="#desk">Front desk</a></div></footer>
    </div><button class="sound-btn" id="sound-btn" data-act="sound">🔊 Click to turn on chime &amp; voice announcements</button>`;
    clearInterval(tvTimer);
    tvTimer = setInterval(() => { if (view === "display") tick(); else clearInterval(tvTimer); }, 1000);
    const frame = document.getElementById("yt");
    if (frame) frame.addEventListener("load", () => setTimeout(() => yt(sound && state.settings.videoSound ? "unMute" : "mute"), 1500));
    if (sound) setSound(true);
  }

  /** Queue numbers are as big as their box allows: a long one (e.g. 128-C1-W) shrinks just enough to fit. */
  function fitNumbers() {
    document.querySelectorAll(".hero .num, .tile .num, .vid-over .num").forEach((el) => {
      el.style.fontSize = "";
      const room = el.parentElement.clientWidth - parseFloat(getComputedStyle(el.parentElement).paddingLeft) - parseFloat(getComputedStyle(el.parentElement).paddingRight);
      if (el.scrollWidth > room) el.style.fontSize = `${(parseFloat(getComputedStyle(el).fontSize) * room) / el.scrollWidth * 0.97}px`;
    });
  }
  window.addEventListener("resize", () => { if (view === "display") fitNumbers(); });

  function tick() {
    const now = Date.now();
    $("#tv-time").textContent = clock.format(now);
    $("#tv-date").textContent = longDate.format(now);
    const latest = state.announcements[state.announcements.length - 1];
    const fresh = Boolean(latest && now - latest.at < 15000);
    $("#hero").classList.toggle("fresh", fresh);
    // A new call covers the video so patients who are watching it don't miss their number.
    const over = $("#vid-over");
    if (over) {
      const html = fresh ? `<div><p class="k">Now calling</p><p class="num mono">${esc(latest.label)}</p><p class="go">Please proceed to <b>${esc(latest.destination)}</b></p></div>` : "";
      if (over.dataset.label !== (fresh ? latest.id : "")) { over.innerHTML = html; over.dataset.label = fresh ? latest.id : ""; fitNumbers(); }
      over.classList.toggle("hidden", !fresh);
    }
  }

  function chime() {
    if (!audio) return;
    [880, 659.25].forEach((frequency, index) => {
      const start = audio.currentTime + index * 0.42;
      const osc = audio.createOscillator();
      const gain = audio.createGain();
      osc.type = "sine"; osc.frequency.value = frequency;
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.35, start + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + 1.1);
      osc.connect(gain).connect(audio.destination);
      osc.start(start); osc.stop(start + 1.2);
    });
  }
  /** A Filipino voice on this computer, preferring natural-sounding ones (e.g. Microsoft Edge's online voices). */
  function filipinoVoice() {
    if (!("speechSynthesis" in window)) return null;
    const voices = speechSynthesis.getVoices().filter((voice) => /^(fil|tl)([-_]|$)/i.test(voice.lang));
    return voices.find((voice) => /natural|online/i.test(voice.name)) ?? voices[0] ?? null;
  }
  function speak(lines) {
    lines.forEach(({ text, lang }) => {
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 0.9; utterance.lang = lang;
      const voice = lang === "fil-PH" ? filipinoVoice() : null;
      if (voice) utterance.voice = voice;
      speechSynthesis.speak(utterance);
    });
  }
  const NO_FILIPINO_VOICE = "This computer has no Filipino voice, so the Tagalog announcement uses its default voice. For a natural Filipino voice, open the board in Microsoft Edge (it includes Filipino voices).";
  function announce(item) {
    chime();
    if (!("speechSynthesis" in window)) return;
    const lines = announcementSpeech(item, state.settings.announceLanguage);
    setTimeout(() => speak(lines), 900);
  }
  function setSound(on) {
    sound = on;
    if (on) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!audio && Ctx) audio = new Ctx();
      audio?.resume();
      if ("speechSynthesis" in window) speechSynthesis.speak(new SpeechSynthesisUtterance(" "));
      // Voices load in the background; check for a Filipino one once they are in.
      if ((state.settings.announceLanguage ?? "en+fil") !== "en") setTimeout(() => { if (view === "display" && "speechSynthesis" in window && !filipinoVoice()) toast(NO_FILIPINO_VOICE, true); }, 1500);
    }
    $("#sound-btn").classList.toggle("hidden", on);
    $("#sound-toggle").textContent = on ? "🔊 Sound on" : "🔇 Sound off";
    if (on && state.settings.videoSound) { yt("unMute"); yt("setVolume", [60]); } else yt("mute");
  }

  function updateDisplay() {
    if (currentVideo() !== mountedVideo) { mountDisplay(); }
    // Announce calls made since the last update, oldest first.
    const list = state.announcements;
    const index = list.findIndex((a) => a.id === seen);
    const fresh = list.slice(index + 1).filter((a) => Date.now() - a.at < 60000);
    seen = list[list.length - 1]?.id ?? null;
    const gap = announcementGap(state.settings.announceLanguage);
    if (sound) fresh.forEach((item, i) => setTimeout(() => announce(item), i * gap));
    // Duck the video while numbers are read out, then bring its sound back.
    if (sound && fresh.length && state.settings.videoSound) {
      yt("mute");
      clearTimeout(unmuteTimer);
      unmuteTimer = setTimeout(() => yt("unMute"), fresh.length * gap + 2000);
    }

    const stations = state.settings.stations.filter((s) => s.active);
    const latest = list[list.length - 1];
    $("#hero").innerHTML = latest
      ? `<p class="k">Now calling</p><p class="num mono">${esc(latest.label)}</p><p class="go">Please proceed to <b>${esc(latest.destination)}</b></p>`
      : `<p class="k">Welcome</p><p class="go" style="max-width:80%">Please wait for your queue number to appear on this screen.</p>`;
    if (fresh.length) { const hero = $("#hero"); hero.classList.remove("fresh"); void hero.offsetWidth; }
    $("#tiles").style.gridTemplateColumns = `repeat(${Math.min(Math.max(stations.length, 1), mountedVideo ? 5 : 3)}, minmax(0, 1fr))`;
    $("#tiles").innerHTML = stations.map((s) => { const v = servingAt(state, s.code)[0]; return `<div class="tile"><p class="s"><b class="mono">${esc(s.code)}</b> · ${esc(s.name)}</p><p class="num mono ${v ? "" : "none"}">${v ? esc(ticketLabel(v, s.code)) : "—"}</p></div>`; }).join("");
    const toRegister = waitingToRegister(state);
    const registering = toRegister.filter((v) => v.regCalledAt).sort((a, b) => b.regCalledAt - a.regCalledAt)[0];
    const nextReg = toRegister.filter((v) => v !== registering);
    $("#reg-call").innerHTML = toRegister.length ? `<div class="reg-call" style="display:block"><p class="h" style="margin:0;display:flex;justify-content:space-between;color:#f4e8c7;font-size:1.1vw"><span>Registration · Front Desk</span><span>${toRegister.length} waiting</span></p><div class="nl" style="border:0;padding:0"><div class="l">${registering ? `<b class="mono" style="background:var(--gold-2);color:var(--brown)">${esc(arrivalLabel(registering))}</b>` : ""}${nextReg.slice(0, registering ? 3 : 4).map((v) => `<b class="mono">${esc(arrivalLabel(v))}</b>`).join("")}</div></div></div>` : "";
    $("#next").innerHTML = stations.map((s) => {
      const waiting = waitingFor(state, s.code);
      return `<div class="nl"><p class="h" style="margin:0"><span>${esc(s.name)}</span><span>${waiting.length} waiting</span></p><div class="l">${waiting.length ? waiting.slice(0, mountedVideo ? 2 : 3).map((v) => `<b class="mono">${esc(ticketLabel(v, s.code))}</b>`).join("") : "<i>—</i>"}</div></div>`;
    }).join("");
    const ticker = $("#ticker");
    if (ticker.textContent !== state.settings.ticker) ticker.textContent = state.settings.ticker;
    fitNumbers();
    tick();
  }

  // ---------- Actions ----------
  document.addEventListener("click", (event) => {
    const el = event.target.closest("[data-act]");
    if (!el) return;
    const { act, id, station, send, index, code } = el.dataset;
    switch (act) {
      case "openTv": window.open(`${location.href.split("#")[0]}#display`, "thsc-queue-tv"); break;
      case "openPoster":
        // Patients' phones cannot open this file, so check-in runs on the sync server's web pages.
        if (sync.mode === "server") window.open(`${syncServer()}/queue/poster`, "_blank", "noopener");
        else toast("QR check-in needs a sync server: patients' phones cannot open this file. Turn on syncing in Sync setup.", true);
        break;
      case "testVoice": {
        if (!("speechSynthesis" in window)) { toast("This browser cannot speak announcements.", true); break; }
        const sample = state.settings.stations.find((s) => s.active) ?? { code: "C1", location: "Clinic Room 1" };
        speechSynthesis.cancel();
        speak(announcementSpeech({ kind: "ticket", label: `07-${sample.code}-W`, destination: sample.location || sample.name }, draft?.announceLanguage ?? state.settings.announceLanguage));
        break;
      }
      case "verify": dispatch({ type: "verify", visitId: id }, "Check-in verified."); break;
      case "openSettings": openSettings(); break;
      case "closeSettings": draft = null; renderSettings(); break;
      case "closeSettingsBg": if (event.target === el) { draft = null; renderSettings(); } break;
      case "addStation": draft.stations.push({ code: "", name: "", location: "", service: "consultation", selfCheckIn: true, active: true }); renderSettings(); break;
      case "removeStation": draft.stations.splice(Number(index), 1); renderSettings(); break;
      case "saveSettings": void dispatch({ type: "updateSettings", settings: draft }, sync.mode === "server" ? "Settings saved. Every computer updates automatically." : "Settings saved. Every open window updates automatically.").then((r) => { if (r.ok) { draft = null; renderSettings(); } }); break;
      case "resetDay": if (confirm(`Clear today's queue${sync.mode === "server" ? " on every computer" : ""}? All queue numbers and calls for today are removed and numbering restarts at 01. Settings are kept.`)) { void dispatch({ type: "resetDay" }, "Today's queue was cleared.").then(() => { issued = null; draft = null; if (view === "desk") { renderSettings(); updateDesk(); } }); } break;
      case "arrive": {
        if (arriving) break;
        arriving = true;
        const print = $("#arr-print").checked;
        void dispatch({ type: "arrive", kind: el.dataset.kind, priority: arr.priority, newPatient: arr.newPatient }).then((r) => {
          arriving = false;
          if (!r.ok) return;
          latestArrival = r.visitId; arr.priority = false; arr.newPatient = false;
          if (view === "desk") updateDesk();
          if (print && !printSlip(r.label, Date.now(), LOGO)) toast("Allow pop-ups for this file to print queue slips.", true);
        });
        break;
      }
      case "slip": { const v = state.visits.find((x) => x.id === id); if (v) printSlip(arrivalLabel(v), v.createdAt, LOGO); break; }
      case "callReg": dispatch({ type: "callRegistration", visitId: id || undefined }, (r) => `${r.label} called to register — shown on the TV.`); break;
      case "removeArrival": { const v = state.visits.find((x) => x.id === id); if (v && confirm(`Remove ${arrivalLabel(v)}? Use this if the patient left before registering.`)) dispatch({ type: "cancel", visitId: id }); break; }
      case "registerArrival": { const v = state.visits.find((x) => x.id === id); if (v) { form.arrival = id; form.kind = v.kind; form.priority = v.priority; form.newPatient = v.newPatient === true; updateDesk(); $("#reg-name").focus(); } break; }
      case "togArrNew": arr.newPatient = !arr.newPatient; updateDesk(); break;
      case "togArrPrio": arr.priority = !arr.priority; updateDesk(); break;
      case "togRegNew": form.newPatient = !form.newPatient; updateDesk(); break;
      case "togRegPrio": form.priority = !form.priority; updateDesk(); break;
      case "kind": form.kind = el.dataset.kind; updateDesk(); break;
      case "step": form.stations.push(code); updateDesk(); break;
      case "unstep": form.stations.splice(Number(index), 1); updateDesk(); break;
      case "closeIssued": issued = null; updateDesk(); break;
      case "filter": filter = el.dataset.filter; updateDesk(); break;
      case "excel": if (state.visits.length) downloadQueueReport(XLSX, state, Date.now()); else toast("No queue numbers yet today.", true); break;
      case "message": void copyMessage(id); break;
      case "priority": { const v = state.visits.find((x) => x.id === id); if (v) dispatch({ type: "updateVisit", visitId: id, priority: !v.priority }); break; }
      case "cancel": { const v = state.visits.find((x) => x.id === id); if (v && confirm(`Cancel ${currentLabel(v)}${v.name ? ` (${v.name})` : ""}?`)) dispatch({ type: "cancel", visitId: id }); break; }
      case "requeue": dispatch({ type: "requeue", visitId: id }, "Back in line."); break;
      case "callNext": dispatch({ type: "call", station }); break;
      case "callOne": dispatch({ type: "call", station, visitId: id }); break;
      case "recall": dispatch({ type: "recall", visitId: id }); break;
      case "miss": dispatch({ type: "miss", visitId: id }); break;
      case "complete": dispatch({ type: "complete", visitId: id, sendTo: send || undefined }); break;
      case "sound": setSound(!sound); break;
      case "fullscreen": document.documentElement.requestFullscreen?.(); break;
    }
  });

  // Keep waiting times fresh on staff screens.
  setInterval(() => { if (view === "desk") { updateDesk(); } else if (view === "station") updateStation(); }, 20000);
  mount();
  void poll();
})();
</script>
</body>
